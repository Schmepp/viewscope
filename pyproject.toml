[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/viewscope",
    "src/viewscope_core",
]

[project]
name = "viewscope"
version = "0.0.1"
description = "CSC3003S-2026 Capstone project."
readme = "README.md"
authors = [
    { name = "Azaam Holdman" },
    { name = "Kira Webb" },
    { name = "Adam Foflonker" },
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.3",
    "pillow>=12.3.0",
    "pyrender>=0.1.45",
    "rtree>=1.4.1",
    "trimesh>=5.0.0",
]

[project.scripts]
viewscope = "viewscope.main:main"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.69",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/__init__.py",
    "src/viewscope_core/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

# Fails pytest if the total coverage falls below this percentage
fail_under = 70
