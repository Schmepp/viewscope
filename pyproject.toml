[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/viewscope",
    "src/viewscope_core",
]

[project]
name = "viewscope"
version = "0.0.1"
description = "CSC3003S-2026 Capstone project."
readme = "README.md"
authors = [
    { name = "Azaam Holdman" },
    { name = "Kira Webb" },
    { name = "Adam Foflonker" },
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.3",
    "pillow>=12.3.0",
    "pyrender>=0.1.45",
    "rtree>=1.4.1",
    "trimesh>=5.0.0",
]

[project.scripts]
viewscope = "viewscope.main:main"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = ["*.pyi", "src/viewscope_core/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
